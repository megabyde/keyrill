[graph]
all-features = false

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0"]
include-dev = true

# Workspace crates are unpublished and are not checked against the allow list
[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

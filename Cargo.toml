[workspace]
members = ["crates/keyrill-core", "crates/keyrill-ffi", "tools/inference-probe"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
panic = "unwind"
lto = "thin"

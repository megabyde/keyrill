[package]
name = "keyrill-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Native adapters link the staticlib; doctests need the rlib
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
keyrill-core = { path = "../keyrill-core", version = "=0.1.0" }

# File-open flags for dictionary reads, and fcntl in tests
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[lints]
workspace = true

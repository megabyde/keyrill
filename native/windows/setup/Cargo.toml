[package]
name = "keyrill-windows-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
maintainer-native-qualification = []

[[bin]]
name = "KeyrillSetup"
path = "src/main.rs"

[dependencies]
keyrill-windows-build = { path = "../build-support" }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
keyrill-windows = { path = "../rust" }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_TextServices", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "=0.62.2"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_LibraryLoader"] }

[lints]
workspace = true

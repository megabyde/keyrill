name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MDBOOK_VERSION: "0.5.4"
      MDBOOK_MERMAID_VERSION: "0.17.1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache CI tools
        uses: Swatinem/rust-cache@v2
        with:
          key: mdbook-${{ env.MDBOOK_VERSION }}-mdbook-mermaid-${{ env.MDBOOK_MERMAID_VERSION }}
          cache-targets: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo install mdbook --locked --version "$MDBOOK_VERSION"
      - run: cargo install mdbook-mermaid --locked --version "$MDBOOK_MERMAID_VERSION"
      - run: ./tools/verify site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/book
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustc -Vv
          clang --version
          git rev-parse HEAD
          if [ "$RUNNER_OS" = macOS ]; then
            pipx install clang-format==23.1.3
            xcrun --show-sdk-version
          fi
      - name: Verify
        shell: bash
        run: ./tools/verify
      - name: Native sanitizers
        if: runner.os == 'macOS'
        run: ./tools/verify sanitize
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: ./tools/verify audit
  coverage:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked --version 0.6.21
      - run: ./tools/verify coverage
      # Uploaded unzipped, the single-page report opens in the browser from the run page
      - id: report
        if: ${{ !cancelled() && hashFiles('target/llvm-cov/keyrill-coverage.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/llvm-cov/keyrill-coverage.html
          archive: false
      - if: ${{ !cancelled() && hashFiles('target/llvm-cov/summary.txt') != '' }}
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo '## Coverage'
            if [ -n "$REPORT_URL" ]; then echo "[Line-level report]($REPORT_URL)"; fi
            echo '```'
            cat target/llvm-cov/summary.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
  core-analysis:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup toolchain install nightly-2026-10-26 --profile minimal --component miri,rust-src
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: ./tools/verify miri
      - run: ./tools/verify fuzz
      - run: ./tools/verify evaluate
